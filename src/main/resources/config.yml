# Model synchronization rate limiting
model-sync:
  # Per-player bandwidth limit in Mbps (0 = unlimited)
  per-player-rate-limit-mbps: 8.0
  # Global total bandwidth limit in Mbps across all players (0 = unlimited)
  global-rate-limit-mbps: 40.0

# Default model/texture for auto-correction when a player's selection is invalid
model-defaults:
  # Model ID to fall back to (must be a loaded model)
  model-id: "default"
  # Texture name to fall back to (must exist on the model)
  texture: "default"

# Web model portal. Put this behind a Baota HTTPS reverse proxy before exposing
# it to the public Internet.
web-portal:
  # 网页标题，会同时显示在浏览器标签、顶部命令栏和首屏字标上。
  # 可以写成服务器名，例如 "星辰聚落 模型中心"。
  title: "YSMSync 模型中心"
  enabled: true
  host: "0.0.0.0"
  port: 25584
  sync-check-interval-seconds: 30
  max-upload-bytes: 16777216
  # Accounts allowed to administer (including deleting) portal-uploaded models.
  admin-users:
    - admin
